dynamixel_ids:
  base: 1
  shoulder: 2
  elbow: 3
  wrist: 4
  gripper: 5

link_lengths:
  L1: 0.077    # Base to Shoulder (단위: m)
  L2: 0.130    # Shoulder to Elbow
  L3: 0.124    # Elbow to Wrist
  L4: 0.120    # Wrist to End-effector

joint_limits:
  base: [-150, 150]        # 약 -143° ~ +143°
  shoulder: [-150, 150]
  elbow: [1.047, 4.188]
