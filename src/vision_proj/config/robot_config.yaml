  gripper: [-20, 60]      # 그리퍼는 설계에 따라 조정

initial_positions:
  base: 0.0
  shoulder: 0.0
  elbow: 0.0
  wrist: 0.0
  gripper: 0.0

control_rate_hz: 20

robot_base_frame: "base_link"
